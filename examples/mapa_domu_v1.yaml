# Karta: Mapa domu (picture-elements)
# Obrazek wrzuć do: /config/www/plan_domu.png  ->  w HA widoczny jako /local/plan_domu.png
# Wszystko z PLACEHOLDER_ podmień na swoje encje.
type: picture-elements
image: /local/plan_domu.png
elements:
  # ---- Garaż ----
  - type: state-icon
    entity: light.PLACEHOLDER_garaz
    title: Garaż - światło
    icon: mdi:lightbulb
    state_color: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    style:
      left: 12%
      top: 32%
      background: rgba(0,0,0,0.45)
      border-radius: 50%
      padding: 6px
      --mdc-icon-size: 28px
  - type: state-label
    entity: sensor.PLACEHOLDER_temperatura_garaz
    style:
      left: 12%
      top: 39%
      color: white
      font-size: 14px
      font-weight: bold
      background: rgba(0,0,0,0.55)
      border-radius: 8px
      padding: 2px 6px
