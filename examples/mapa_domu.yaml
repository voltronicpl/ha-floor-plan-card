# Karta: Mapa domu (picture-elements)
# Wrzuć całą zawartość folderu www/mapa/ (albo rozpakuj mapa_www.zip) do /config/www/mapa/  ->  w HA: /local/mapa/...
# Wszystko z PLACEHOLDER_ podmień na swoje encje.
type: picture-elements
image: /local/mapa/plan_domu_noc.png
elements:
  # ==== WARSTWY STANU (pod ikonami, nie łapią kliknięć) ====
  # Światło: włączone = pokój rozjaśniony, wyłączone = ciemno (nocne tło)
  - type: image
    entity: switch.wylacznik_swiatlo_garaz
    image: /local/mapa/pusty.png
    state_image:
      "on": /local/mapa/swiatlo_garaz.png
      "off": /local/mapa/pusty.png
    tap_action:
      action: none
    hold_action:
      action: none
    style:
      left: 50%
      top: 50%
      width: 100%
      pointer-events: none
  - type: image
    entity: light.pokoj_druk
    image: /local/mapa/pusty.png
    state_image:
      "on": /local/mapa/swiatlo_warsztat.png
      "off": /local/mapa/pusty.png
    tap_action:
      action: none
    hold_action:
      action: none
    style:
      left: 50%
      top: 50%
      width: 100%
      pointer-events: none
  - type: image
    entity: light.salon_swiatlo_wszystkie_grupa
    image: /local/mapa/pusty.png
    state_image:
      "on": /local/mapa/swiatlo_salon.png
      "off": /local/mapa/pusty.png
    tap_action:
      action: none
    hold_action:
      action: none
    style:
      left: 50%
      top: 50%
      width: 100%
      pointer-events: none
  - type: conditional
    conditions:
      - condition: state
        entity: light.PLACEHOLDER_biuro
        state_not: unavailable
    elements:
      - type: image
        entity: light.PLACEHOLDER_biuro
        image: /local/mapa/pusty.png
        state_image:
          "on": /local/mapa/swiatlo_biuro.png
          "off": /local/mapa/pusty.png
        tap_action:
          action: none
        hold_action:
          action: none
        style:
          left: 50%
          top: 50%
          width: 100%
          pointer-events: none
  - type: image
    entity: light.sypialnia_swiatlo_grupa
